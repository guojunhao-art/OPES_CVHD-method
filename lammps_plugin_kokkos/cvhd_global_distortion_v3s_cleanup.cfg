# CVHD global distortion V3s-cleanup production/profiling configuration
carbon_type = 1
hydrogen_type = 2
output_file = cvhd_v3s_cleanup.colvar
output_stride = 1000
compute_stride = 1

# Kokkos backend
kk_pair_cache_policy = safe
kk_fused_neighbor_enable = 1
kk_max_cc_partners = 8
kk_max_ch_partners = 4

# Profiling timers: enable for short profiling runs, disable for production
cvhd_timer_enable = 0
cvhd_timer_stride = 20000
cvhd_timer_reset_each_print = 1

# H-state tracking
h_event_scan_enable = 1

# CVHD variables
cvhd_power = 10
cv1_cutoff_cc = 0.4194
cv1_cutoff_ch = 0.5273
cv2_cutoff_ccform = 0.28
cc_form_candidate_rmax = 3.0

# Bias and OPES-CVHD
bias_enable = 1
opes_use_cv2 = 1
opes_temperature = 1500.0
opes_barrier = 10.0
opes_barrier_increment = 3.0
opes_barrier_max = 0.0
opes_biasfactor = 0.0
opes_pace = 1000
opes_adaptive_sigma_stride = 1000
opes_kernel_cutoff = 6.0
opes_compression_threshold = 0.01
opes_recursive_merge = 1
opes_epsilon = 1.0e-12
opes_fixed_sigma = 0
opes_no_zed = 0
opes_ct_window = 10
opes_ct_min_stable_windows = 3
opes_ct_slope_threshold = 0.015
opes_dE_damp_enable = 1
opes_dE_damp_slowf = 1.0
opes_dE_damp_pos_cv1 = 1.0
opes_dE_damp_pos_cv2 = 1.0
opes_dE_damp_grid = 10

cvhd_reset_enable = 1
cvhd_waittime = 10000
cvhd_event_threshold = 1.0

# Legacy connectivity update is disabled in the V3s event-local state machine.
cc_connectivity_update = 0
cc_break_bond_threshold = 0.0
cc_form_bond_threshold = 0.0

# C-C breaking channel
cc_break_enable = 1
cc_break_ref = 1.55
cc_break_rmin = 1.30
cc_break_rmax = 1.70
cc_break_power = 10
cc_break_reset_ref = 0
cc_break_reset_maxdist = 0.0
cc_break_reset_time = 0

# C-H breaking channel
ch_break_enable = 1
ch_break_ref = 1.10
ch_break_rmin = 0.85
ch_break_rmax = 1.30
ch_break_power = 10
ch_break_reset_ref = 0
ch_break_reset_maxdist = 0.0
ch_break_reset_time = 0

# C-C formation channel
cc_form_enable = 1
cc_form_ref = 2.5
cc_form_rmin = 0.0
cc_form_rmax = 0.0
cc_form_power = 10
cc_form_reset_ref = 0
cc_form_reset_maxdist = 0.0
cc_form_reset_time = 0
cc_form_nl_stride = 1
